name: Refresh church directory

on:
  schedule:
    - cron: "0 13 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh church data
        run: python scripts/refresh.py

      - name: Open a pull request when the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- churches.json churches.js; then
            echo "Church data is unchanged. No pull request opened."
            exit 0
          fi
          branch="church-refresh-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -- churches.json churches.js
          git commit -m "Refresh Tampa Bay church directory"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Refresh Tampa Bay church directory" \
            --body "Monthly refresh of churches.json and churches.js from the Church of God Florida locator. Unchanged addresses keep their saved coordinates. Merging updates the GitHub Pages site at https://78tacos.github.io/tampa-churches/."
