name: Refresh church directory

on:
  schedule:
    - cron: "0 13 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh church data
        run: python scripts/refresh.py FL

      - name: Commit to main when the data changed
        run: |
          if git diff --quiet -- churches.json churches.js; then
            echo "Church data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- churches.json churches.js
          git commit -m "Refresh Florida church directory"
          git push origin HEAD:main
