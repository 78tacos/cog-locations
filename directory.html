<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Church of God Directory — Florida and the Southeast</title>
<style>body{font-family:system-ui,sans-serif;max-width:900px;margin:20px auto;padding:0 12px;font-size:14px}h2{border-bottom:2px solid #333;margin:18px 0 6px;font-size:17px;break-after:avoid}
.c{padding:5px 0;border-bottom:1px solid #ddd;break-inside:avoid}.c b{font-size:15px}.ap{color:#a60;font-size:11px}#f{width:40%;font-size:15px;padding:4px}select{font-size:15px;padding:3px}
@media (max-width:768px){body{margin:12px auto;font-size:15px}#f,select{width:100%;font-size:16px;min-height:44px;box-sizing:border-box;margin:6px 0}.np button{min-height:44px;padding:0 16px}.c{padding:10px 0;overflow-wrap:anywhere}.c a{display:inline-block;padding:4px 0}h1{font-size:19px!important}}
@media print{.np{display:none}body{font-size:11px;margin:0}a{color:#000;text-decoration:none}}</style></head><body>
<div class="np"><a href="index.html">← Map</a> · <select id="st" aria-label="State"></select> <select id="co" aria-label="County"><option value="">All counties</option></select> <select id="ci" aria-label="City"><option value="">All cities</option></select> <input id="f" placeholder="Filter by name, pastor, address…"> <button onclick="print()">Print</button> <span id="n"></span></div>
<h1 style="font-size:20px">Church of God Directory — Florida and the Southeast</h1><div id="out"></div>
<script src="churches.js"></script><script>
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id),grp=c=>c.city_group||c.city||'(No city listed)';
const STATE_NAME={FL:'Florida',GA:'Georgia',AL:'Alabama',SC:'South Carolina',NC:'North Carolina',TN:'Tennessee',MS:'Mississippi'};
const states=[...new Set(CHURCHES.map(c=>c.state))].filter(Boolean).sort();
$('st').innerHTML='<option value="">All states</option>'+states.map(code=>`<option value="${esc(code)}">${esc(STATE_NAME[code]||code)}</option>`).join('');
function scoped(){const st=$('st').value;return CHURCHES.filter(c=>!st||c.state===st)}
function countyValue(c){return c.state+'|'+c.county}
function citiesNeedState(){return !$('st').value&&!$('co').value}
function cityValue(c){return citiesNeedState()?c.state+'|'+grp(c):grp(c)}
function refillCounties(){
 const multi=!$('st').value,cur=$('co').value,seen=new Set(),rows=[];
 scoped().forEach(c=>{if(!c.county)return;const v=countyValue(c);if(seen.has(v))return;seen.add(v);rows.push([v,multi?c.county+', '+c.state:c.county])});
 rows.sort((a,b)=>a[1].localeCompare(b[1]));
 $('co').length=1;
 $('co').insertAdjacentHTML('beforeend',rows.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join(''));
 $('co').value=[...$('co').options].some(o=>o.value===cur)?cur:'';
}
function refillCities(){
 const co=$('co').value,cur=$('ci').value,seen=new Set(),rows=[];
 scoped().forEach(c=>{
  if(co&&countyValue(c)!==co)return;
  const v=cityValue(c);if(seen.has(v))return;seen.add(v);
  rows.push([v,citiesNeedState()?grp(c)+', '+c.state:grp(c)]);
 });
 rows.sort((a,b)=>a[1].localeCompare(b[1]));
 $('ci').length=1;
 $('ci').insertAdjacentHTML('beforeend',rows.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join(''));
 $('ci').value=[...$('ci').options].some(o=>o.value===cur)?cur:'';
}
function draw(){
 const q=$('f').value.toLowerCase(),st=$('st').value,co=$('co').value,ci=$('ci').value,multi=!st,g=new Map();let n=0;
 CHURCHES.filter(c=>{
  if(st&&c.state!==st)return false;
  if(co&&countyValue(c)!==co)return false;
  if(ci&&cityValue(c)!==ci)return false;
  if(q){const hay=[c.name,c.pastor,c.address1,c.address2,c.city,c.zip,c.phone,c.email,c.website,c.county,c.state,STATE_NAME[c.state]||''].join(' ').toLowerCase();if(!hay.includes(q))return false}
  return true;
 }).forEach(c=>{const key=multi?grp(c)+'\n'+c.state:grp(c);if(!g.has(key))g.set(key,[]);g.get(key).push(c);n++});
 $('n').textContent=n+' churches';
 const keys=[...g.keys()].sort((a,b)=>a.localeCompare(b));
 $('out').innerHTML=keys.map(k=>{
  const rows=g.get(k).slice().sort((a,b)=>a.name.localeCompare(b.name)),first=rows[0];
  const title=multi?grp(first)+', '+first.state:grp(first);
  const county=first.county?(multi?first.county+' County, '+first.state:first.county+' County'):'';
  return `<h2>${esc(title)} <small style="font-weight:normal;color:#666">${county?esc(county)+' · ':''}${rows.length}</small></h2>`+rows.map(c=>`<div class=c><b>${esc(c.name)}</b>${c.pastor?' — Pastor '+esc(c.pastor):''}<br>${esc([c.address1,c.address2].filter(Boolean).join(', '))}${c.city?', '+esc(c.city):''}, ${c.state} ${c.zip}${c.approx?' <span class=ap>(map location approx.)</span>':''}${typeof c.lat!=='number'?' <span class=ap>(not on map)</span>':''}<br>${[c.phone&&esc(c.phone),c.website&&`<a href="${esc(/^https?:/.test(c.website)?c.website:'http://'+c.website)}">${esc(c.website)}</a>`,c.email&&`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`].filter(Boolean).join(' · ')}</div>`).join('');
 }).join('');
}
$('st').onchange=()=>{refillCounties();refillCities();draw()};$('co').onchange=()=>{refillCities();draw()};$('ci').onchange=draw;$('f').oninput=draw;refillCounties();refillCities();draw();
</script></body></html>
